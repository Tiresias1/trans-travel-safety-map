name: validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet shapely
      - name: Validate data + rebuild ranks/meta
        run: python3 tools/build_data.py
      - name: Check committed data is in sync with build output
        run: |
          git diff --quiet data/countries.json data/admin1.json || {
            echo "::error::ranks/bands out of sync — run tools/build_data.py and commit"
            git diff --stat data/countries.json data/admin1.json
            exit 1
          }
      - name: Validate boundary geometry
        run: python3 - <<'EOF'
import json
from pathlib import Path
ROOT = Path.cwd()
for name in ("countries", "admin1"):
    gj = json.loads((ROOT / "boundaries" / f"{name}.geojson").read_text())
    assert gj["type"] == "FeatureCollection", name
    assert len(gj["features"]) > 200 if name == "countries" else len(gj["features"]) > 3000
    for f in gj["features"]:
        assert isinstance(f.get("properties"), dict), f
        assert f.get("geometry"), f
print("boundaries OK")
EOF
      - name: JavaScript syntax check
        run: node --check js/app.js